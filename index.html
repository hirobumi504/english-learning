<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="会議英語">
<meta name="theme-color" content="#EEF2F0">
<title>会議英語トレーナー</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --paper:#EEF2F0; --card:#FFFFFF; --ink:#1B2420; --muted:#62706A; --line:#CFD8D4;
  --accent:#0E5A55; --accent-ink:#FFFFFF; --accent-soft:#D5E7E3;
  --hit:#2B7A4B; --hit-soft:#DDEFE3; --miss:#A9412F; --miss-soft:#F5E1DC; --note:#7A5A10; --note-soft:#F4EAD2;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.55}
.en{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:10px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7BB5AD;outline-offset:2px}
.hidden{display:none!important}
.screen{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}

/* ---------- home ---------- */
.brand{font-size:13px;color:var(--muted);margin:4px 0 2px}
h1{font-size:24px;line-height:1.3;margin:0 0 16px}
.brief{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:12px}
.brief .scene{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:2px}
.brief h2{font-size:20px;margin:0 0 12px;line-height:1.35}
.brief dl{margin:0;display:grid;grid-template-columns:6.6em 1fr;row-gap:6px;font-size:15px}
.brief dt{color:var(--muted)}
.brief dd{margin:0}
.brief .situation{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink)}
.btn-main{background:var(--accent);color:var(--accent-ink);font-weight:700;width:100%;padding:15px;font-size:17px}
.btn-sub{background:transparent;color:var(--accent);border:1.5px solid var(--accent);font-weight:600;width:100%;padding:12px}
.btn-text{background:transparent;color:var(--accent);font-weight:600;padding:8px 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.block h3{font-size:15px;margin:0 0 10px}
.seg{display:flex;background:#E3E9E6;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;padding:9px 4px;font-size:14px;color:var(--muted);font-weight:600;border-radius:8px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,40,35,.15)}
.seg-note{font-size:13px;color:var(--muted);margin:8px 0 0}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field select,.field input{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px;border-top:1px solid #E6ECE9}
.toggle:first-of-type{border-top:0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #E6ECE9}
.hist li:first-child{border-top:0}
.hist .pct{font-weight:700}
.empty-note{color:var(--muted);font-size:14px;margin:0}
.warn-box{background:var(--note-soft);color:var(--note);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* ---------- meeting ---------- */
#meeting{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
.rail{flex:none;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.rail-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.rail-steps{display:flex;gap:4px}
.rail-steps div{flex:1;text-align:center;font-size:12px;font-weight:600;padding:7px 0 6px;border-radius:7px;background:#E1E8E5;color:var(--muted);position:relative}
.rail-steps div.now{background:var(--accent);color:#fff}
.rail-steps div.done{background:var(--accent-soft);color:var(--accent)}
.rail-steps i{display:block;font-style:normal;font-size:10px;font-weight:500;opacity:.85}
.log{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;margin-bottom:12px}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.msg .bubble{padding:10px 13px;border-radius:14px;font-size:17px;line-height:1.45}
.msg.them .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{margin-left:auto}
.msg.me .who{text-align:right}
.msg.me .bubble{background:var(--accent);color:#fff;border-top-right-radius:4px}
.msg .ja{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
.msg .cc-hidden{color:var(--muted);font-size:14px}
.msg .reveal{background:none;color:var(--accent);font-size:13px;font-weight:600;padding:2px 0}
.msg .tips{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.tip{background:var(--note-soft);color:#5A430B;border-radius:8px;padding:6px 9px;font-size:13px;line-height:1.45}
.tip b{font-weight:600}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.35;animation:blink 1.1s infinite}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.6}}
.sys{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 14px}

.dock{flex:none;background:var(--card);border-top:1px solid var(--line);padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);max-height:56dvh;overflow-y:auto}
.dock-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dock-head b{font-size:15px}
.dock-head button{font-size:13px}
.goals{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:5px}
.goals li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45}
.goals .mark{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.goals li.hit .mark{background:var(--hit);border-color:var(--hit)}
.goals li.miss .mark{border-color:var(--miss)}
.goals .ph{display:block;font-size:13px;color:var(--accent)}
.script{background:#F4F7F6;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:16px;line-height:1.55}
.script .ja{font-size:13px;color:var(--muted);margin-top:6px}
.live{min-height:52px;border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:16px;margin-bottom:10px;word-break:break-word}
.live.on{border-color:var(--accent)}
.live .ph-text{color:var(--muted);font-size:14px}
.live .interim{color:var(--muted)}
.mic{background:var(--accent);color:#fff;font-weight:700;font-size:17px;padding:15px}
.mic.on{background:var(--miss)}
.btn-done{background:var(--ink);color:#fff;font-weight:700;padding:15px}
.btn-done:disabled{opacity:.35}
.dock .minor{display:flex;justify-content:space-between;margin-top:6px}
.dock textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;min-height:72px;margin-bottom:8px;font-family:inherit}

/* ---------- review ---------- */
.score{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.score b{font-size:44px;line-height:1;color:var(--accent)}
.score span{color:var(--muted)}
.meta{color:var(--muted);font-size:14px;margin:0 0 16px}
.rv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.rv-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rv-head h3{margin:0;font-size:16px}
.rv-head span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:99px;font-weight:600}
.chip.hit{background:var(--hit-soft);color:var(--hit)}
.chip.miss{background:var(--miss-soft);color:var(--miss)}
.said{font-size:15px;border-left:3px solid var(--accent-soft);padding:2px 0 2px 10px;margin:0 0 8px}
.said.none{color:var(--muted);font-size:14px}
.q{font-size:14px;color:var(--muted);margin:10px 0 4px}
.model{margin-top:6px}
.model summary{font-size:14px;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
.play{background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:6px 12px;margin-top:6px}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div class="screen" id="home">
  <p class="brand">会議英語トレーナー</p>
  <h1>今日の会議</h1>
  <div id="noSR" class="warn-box hidden"></div>
  <div class="brief" id="brief"></div>
  <div class="row" style="margin-bottom:16px">
    <button class="btn-sub" id="btnShuffle">別の会議にする</button>
  </div>

  <div class="block">
    <h3>練習のしかた</h3>
    <div class="seg" id="modeSeg" role="group" aria-label="練習のしかた">
      <button data-mode="script">台本を見る</button>
      <button data-mode="hint">ヒントだけ</button>
      <button data-mode="bare">何も見ない</button>
    </div>
    <p class="seg-note" id="modeNote"></p>
  </div>

  <button class="btn-main" id="btnStart" style="margin-bottom:16px">この会議を始める</button>

  <div class="block">
    <h3>会議の選び方</h3>
    <div class="field"><label for="selTheme">テーマ</label><select id="selTheme"></select></div>
    <div class="field" style="margin-bottom:0"><label for="selPersona">相手のタイプ</label><select id="selPersona"></select></div>
  </div>

  <div class="block">
    <h3>設定</h3>
    <div class="field"><label for="inName">あなたの名前(台本に入ります)</label><input id="inName" class="en" placeholder="例: Hiro" autocomplete="off"></div>
    <div class="field"><label for="selCC">相手の英語の字幕</label>
      <select id="selCC"><option value="always">話しながら表示</option><option value="after">話し終えてから表示</option><option value="off">表示しない(タップで表示)</option></select></div>
    <div class="field"><label for="selRate">相手の話す速さ</label>
      <select id="selRate"><option value="0.8">ゆっくり</option><option value="0.9">やや ゆっくり</option><option value="1">ふつう</option></select></div>
    <label class="toggle">相手の発言に日本語訳を付ける<input type="checkbox" id="chkJa"></label>
    <label class="toggle">言い漏らした点を相手が聞き返す<input type="checkbox" id="chkProbe"></label>
  </div>

  <div class="block">
    <h3>最近の練習</h3>
    <ul class="hist" id="hist"></ul>
  </div>
</div>

<!-- ================= MEETING ================= -->
<div id="meeting" class="hidden">
  <div class="rail">
    <div class="rail-top"><span id="railTitle"></span><button class="btn-text" id="btnQuit" style="padding:0">終了</button></div>
    <div class="rail-steps" id="railSteps"></div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="dock hidden" id="dock">
    <div class="dock-head"><b id="dockTitle"></b><button class="btn-text" id="btnToggleAid"></button></div>
    <div id="aid"></div>
    <div class="live" id="live"><span class="ph-text">「話す」を押して英語で話してください</span></div>
    <div id="typeBox" class="hidden"><textarea id="typeIn" class="en" placeholder="英語で入力"></textarea></div>
    <div class="row">
      <button class="mic" id="btnMic">話す</button>
      <button class="btn-done" id="btnDone" disabled>話し終えた</button>
    </div>
    <div class="minor">
      <button class="btn-text" id="btnRetry">言い直す</button>
      <button class="btn-text" id="btnType">文字で入力</button>
      <button class="btn-text" id="btnSkip">スキップ</button>
    </div>
  </div>
</div>

<!-- ================= REVIEW ================= -->
<div class="screen hidden" id="review">
  <p class="brand">振り返り</p>
  <h1 id="rvTitle"></h1>
  <div class="score"><b id="rvPct"></b><span>伝えるべき点のカバー率</span></div>
  <p class="meta" id="rvMeta"></p>
  <div id="rvBody"></div>
  <div class="row" style="margin-top:8px">
    <button class="btn-main" id="btnAgain">同じ会議をもう一度</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn-sub" id="btnHome">トップに戻る</button>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const POOL = {
  cname: ["Emma Clark","David Miller","Sarah Lee","Michael Brown","Priya Shah","Tom Wilson","Laura Chen","James Park"],
  company: ["Northbridge Telecom","Bluewave Networks","Harbor Communications","Summit Telecom"],
  day: [["Friday","金曜日"],["next Monday","来週月曜日"],["Wednesday","水曜日"],["next Tuesday","来週火曜日"]],
  minutes: [["20","20"],["30","30"]],
  speed: [["about two hours","about fifteen minutes","約2時間","約15分"],["half a day","about one hour","半日","約1時間"],["about three hours","about twenty minutes","約3時間","約20分"]],
  delay: [["three days","3日"],["about a week","約1週間"],["two days","2日"]],
  pilot: [["two to three months","2〜3か月"],["about three months","約3か月"]],
  months: [["three months","3か月"],["six months","6か月"]],
  hours: [["two hours","2時間"],["three hours","3時間"]]
};

const PERSONAS = {
  friendly:  { ja:"協力的", brief:"相手は友好的で、話をよく聞いてくれます。", rate:1.0 },
  busy:      { ja:"忙しい", brief:"相手は忙しく、時間を気にしています。手短に要点を。", rate:1.06 },
  skeptical: { ja:"慎重",   brief:"相手は慎重で、厳しめの質問をしてきます。", rate:0.97 }
};

const SECTIONS = [
  { id:"opening", ja:"冒頭" },
  { id:"purpose", ja:"目的共有" },
  { id:"explain", ja:"説明" },
  { id:"qa",      ja:"質疑" },
  { id:"wrapup",  ja:"まとめ" }
];

const L = (en, ja) => ({ en, ja });
const G = (ja, phrase, re, t) => ({ ja, phrase, re, t });

const COMMON = {
  qaIntro: {
    friendly:[L("Thank you. I have a couple of questions.","ありがとうございます。いくつか質問があります。")],
    busy:[L("OK. Two quick questions.","わかりました。手短に2つ質問です。")],
    skeptical:[L("I have some questions.","いくつか質問があります。"), L("Let me ask you a few things.","いくつか聞かせてください。")]
  },
  good: {
    friendly:[L("That's very clear. Thank you.","とても分かりやすいです。ありがとうございます。"), L("Great, that helps.","いいですね、参考になります。")],
    busy:[L("OK, got it.","はい、わかりました。"), L("Clear. Thanks.","了解です。")],
    skeptical:[L("OK, that makes sense.","なるほど、筋は通っていますね。"), L("Fair enough.","わかりました。")]
  },
  weak: [L("I see. Maybe we can talk about that in more detail later.","なるほど。その点は後で詳しく話しましょう。"),
         L("OK. Could you send me more details after the meeting?","わかりました。会議の後で詳細を送ってもらえますか?")],
  probe: ["Sorry, could you tell me a bit more about {t}?", "What about {t}?", "Could you say a little more about {t}?"],
  probeJa: "「{t}」について聞き返されています"
};

const THEMES = [
/* ---------------- Theme 1 ---------------- */
{
  id:"ai-ops", scene:"顧客との打ち合わせ",
  title:"AIによるネットワーク運用自動化のご紹介",
  roles:[["Head of Network Operations","ネットワーク運用部門の責任者"],["Director of Network Engineering","ネットワーク技術部門のディレクター"]],
  you:"あなたはコンサルタントとして、通信事業者の顧客にAIによる障害対応の自動化を紹介します。",
  sections:{
    opening:{
      prompt:{
        friendly:[L("Hi, thanks for coming today. How are you?","こんにちは、今日はお越しいただきありがとうございます。お元気ですか?")],
        busy:[L("Hi. Sorry, I only have {minutes} minutes today, so let's get started.","こんにちは。すみません、今日は{minutes}分しかないので始めましょう。")],
        skeptical:[L("Hello. Thanks for coming. To be honest, I'm not sure AI is ready for network operations yet.","こんにちは。お越しいただきありがとうございます。正直、AIがネットワーク運用に使える段階なのか疑問です。")]
      },
      goals:[
        G("時間を取ってもらったお礼","Thank you for your time.",/thank|appreciate/,"your thanks"),
        G("自己紹介(名前と役割)","My name is ..., and I'm ...",/my name|i'm \w+|i am \w+|i work|i lead|my role|responsible/,"who you are")
      ],
      cond:{
        friendly:G("調子を聞かれたことに答える","I'm doing well, thank you.",/good|fine|great|well|doing/,"how you are"),
        busy:G("時間内に収めると伝える","I'll keep it short.",/minutes|short|brief|quick|on time|within|keep/,"the time"),
        skeptical:G("相手の懸念を受け止める","I understand your concern.",/understand|concern|fair|good point|that's why|i see|question/,"your concern")
      },
      script:L("Thank you for taking the time to meet with us today. My name is {me}, and I work on AI and network projects for telecom companies.",
               "本日はお時間をいただきありがとうございます。{me}と申します。通信事業者向けにAIとネットワークのプロジェクトを担当しています。"),
      condScript:{
        friendly:Object.assign(L("I'm doing well, thank you. And thank you for taking the time to meet with us today. My name is {me}, and I work on AI and network projects for telecom companies.","おかげさまで元気です。本日はお時間をいただきありがとうございます。{me}と申します。通信事業者向けにAIとネットワークのプロジェクトを担当しています。"),{replace:true}),
        busy:L("I'll keep it short and finish on time.","手短にして、時間内に終えます。"),
        skeptical:L("I understand your concern. That's exactly what I'd like to discuss today.","ご懸念はよく分かります。まさにそれを今日お話ししたいと思っています。")
      },
      reaction:{
        friendly:[L("Nice to meet you. I'm {cname}. I lead network operations here.","はじめまして。{cname}です。ここでネットワーク運用を担当しています。")],
        busy:[L("Nice to meet you. Please go ahead.","はじめまして。どうぞ進めてください。")],
        skeptical:[L("Nice to meet you. I'm {cname}. Let's see what you have.","はじめまして。{cname}です。どんな内容か見せてください。")]
      }
    },
    purpose:{
      prompt:{
        friendly:[L("So, what would you like to talk about today?","それで、今日はどんなお話でしょうか?")],
        busy:[L("So, what's the goal of today's meeting?","それで、今日の会議の目的は何ですか?")],
        skeptical:[L("So, what exactly do you want to discuss?","それで、具体的に何を話したいのですか?")]
      },
      goals:[
        G("今日の目的","The purpose of today's meeting is to ...",/purpose|goal|objective|today i'd like|today we|i'd like to (share|introduce|show|talk|present)|we'd like to/,"the goal of today's meeting"),
        G("進め方(アジェンダ)","First, ... Then, ... Finally, ...",/agenda|first|then|after that|finally|two (parts|things)|three (parts|things|points)/,"the agenda"),
        G("相手に期待すること(課題を聞きたい)","I'd like to hear about your challenges.",/your (challenges|issues|thoughts|feedback|priorities|situation)|hear (from|about)|learn about|understand your/,"what you need from us")
      ],
      script:L("The purpose of today's meeting is to share some recent examples of AI in network operations, and to understand your current challenges. First, I'll give a short overview. Then, I'd like to hear your thoughts. Finally, we'll agree on next steps.",
               "本日の目的は、ネットワーク運用におけるAI活用の最新事例を共有し、現在の課題をお伺いすることです。まず簡単に概要をご説明し、その後ご意見を伺い、最後に次のステップを合意したいと思います。"),
      reaction:{
        friendly:[L("Sounds good.","いいですね。")],
        busy:[L("OK. Let's keep it quick.","わかりました。手短にお願いします。")],
        skeptical:[L("OK. I'd like to see real results, not just ideas.","わかりました。アイデアではなく実績を見たいですね。")]
      }
    },
    explain:{
      prompt:{

/* 日本語の型 → 自然な英語(プロンプト1の分析を反映) */
const RULES = [
  { re:/\bsorry (to|for) (bother|disturb)/, from:"Sorry to bother you", to:"Could you help me with …? / I'd appreciate it if you could …", ja:"「お手数ですが」の直訳。依頼は謝罪ではなく丁寧な依頼文で" },
  { re:/\bhow about (this|it|that)\b/, from:"How about this?", to:"What do you think? / Does this work for you?", ja:"「いかがでしょうか」は意見を聞く形に" },
  { re:/\bplease confirm\b/, from:"Please confirm.", to:"Could you take a look and let me know if anything needs changing?", ja:"「ご確認ください」は何を確認してほしいかを添える" },
  { re:/\bi want to\b/, from:"I want to …", to:"I'd like to …", ja:"ビジネスでは I'd like to が自然" },
  { re:/\bcan you\b/, from:"Can you …?", to:"Could you …?", ja:"依頼は Could you の方が柔らかい" },
  { re:/\bis it (ok|okay|all right) (that|if)\b/, from:"Is it OK that …?", to:"Just to confirm, … / Would it be all right if …?", ja:"「〜でよろしいでしょうか」は確認の定型句で" },
  { re:/\bdiscuss about\b/, from:"discuss about", to:"discuss", ja:"discuss の後に about は不要" },
  { re:/\bexplain about\b/, from:"explain about", to:"explain", ja:"explain の後に about は不要" },
  { re:/\bplease tell me\b/, from:"Please tell me …", to:"Could you tell me …?", ja:"命令形に聞こえやすいので疑問形に" },
  { re:/\bteach me\b/, from:"teach me", to:"tell me / show me", ja:"情報を教えてもらう時は teach ではなく tell" },
  { re:/\bi will explain\b/, from:"I will explain …", to:"Let me walk you through …", ja:"説明の切り出しの定番表現" },
  { re:/\bnext time meeting\b/, from:"next time meeting", to:"our next meeting", ja:"語順に注意" },
  { re:/\bsorry for (the )?late\b/, from:"Sorry for late", to:"Sorry I'm late. / Sorry for the delay.", ja:"文法の崩れやすい定型句" },
  { re:/\bas i said\b/, from:"As I said", to:"As I mentioned", ja:"As I said は相手を責めて聞こえることがある" },
  { re:/(\bi think\b.*){3,}/, from:"I think …(多用)", to:"My understanding is that … / 事実は言い切る", ja:"「〜と思います」を全部訳すと自信がなく聞こえる" },
  { re:/(\bsorry\b.*){2,}/, from:"Sorry …(多用)", to:"Thank you for … に置き換える", ja:"謝罪を重ねるより感謝で表現する方が自然" }
];

  const all = speechSynthesis.getVoices().filter(v => /^en[-_](US|GB|AU|CA|IE|NZ)/i.test(v.lang));

function speak(text, opts={}){
  return new Promise(resolve => {
    if (!("speechSynthesis" in window) || !text){ resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = opts.voice || (S && S.voice);
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
    u.rate = (parseFloat(settings.rate) || 0.9) * (opts.personaRate || 1);
    let done = false;
    const end = () => { if (done) return; done = true; clearTimeout(t); resolve(); };
    const t = setTimeout(end, text.length * 110 / u.rate + 3000);
    u.onend = end; u.onerror = end;
    if (opts.onstart) u.onstart = opts.onstart;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
}
function stopSpeaking(){ if ("speechSynthesis" in window) speechSynthesis.cancel(); }

/* =========================================================
   SPEECH: STT (auto-restart for long monologues)
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

class Listener {
  constructor(){ this.reset(); this.active=false; this.rec=null; }
  reset(){ this.committed=[]; this.finals={}; this.interim=""; }
  text(){
    const cur = Object.keys(this.finals).sort((a,b)=>a-b).map(k=>this.finals[k]).join(" ");
    return [...this.committed, cur].join(" ").replace(/\s+/g," ").trim();
  }
  start(onUpdate, onFatal){
    if (!SR){ onFatal("unsupported"); return; }
    this.onUpdate = onUpdate; this.onFatal = onFatal; this.active = true; this.quick = 0;
    this._spawn();
  }
  _spawn(){
    const rec = new SR();
    rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    const born = performance.now();
    rec.onresult = e => {
      let interim = "";
      for (let i=0;i<e.results.length;i++){
        const r = e.results[i];
        if (r.isFinal) this.finals[i] = r[0].transcript; else interim += r[0].transcript;
      }
      this.interim = interim;
      this.onUpdate(this.text(), this.interim);
    };
    rec.onerror = e => {
      if (e.error === "service-not-allowed" || e.error === "not-allowed"){
        this.active = false; this.onFatal(e.error);
      }
    };
    rec.onend = () => {
      const cur = Object.keys(this.finals).sort((a,b)=>a-b).map(k=>this.finals[k]).join(" ");
      const tail = (cur + " " + this.interim).trim();
      if (tail) this.committed.push(tail);
      this.finals = {}; this.interim = "";
      this.onUpdate(this.text(), "");
      this.quick = (performance.now()-born < 400) ? this.quick+1 : 0;
      if (this.active && this.quick < 8) setTimeout(() => { if (this.active) this._spawn(); }, 120);
      else { this.active = false; if (this._stopResolve) this._stopResolve(); }
    };
    this.rec = rec;
    try { rec.start(); } catch(_){ setTimeout(() => { if (this.active) this._spawn(); }, 300); }
  }
  stop(){
    return new Promise(res => {
      if (!this.active || !this.rec){ this.active=false; res(); return; }
      this.active = false; this._stopResolve = () => { this._stopResolve=null; res(); };
      try { this.rec.stop(); } catch(_){ res(); }
      setTimeout(() => { if (this._stopResolve) this._stopResolve(); }, 1500);
    });
  }
  abort(){ this.active=false; try{ this.rec && this.rec.abort(); }catch(_){} }
}
const listener = new Listener();

  if (S.aborted) return;
  const bubble = wrap.querySelector(".bubble");

    await speak(en, { personaRate: PERSONAS[S.persona].rate });

function userTurn(title, goals, script){
  return new Promise(resolve => {
    const turn = { goals, script, status:null };
    S.turn = turn;
    listener.reset();
    $("dock").classList.remove("hidden");
    $("dockTitle").textContent = title;
    aidOpen = true; renderAid(turn);
    requestAnimationFrame(scrollLog); setTimeout(scrollLog, 150);
    const live = $("live");
    const paint = (txt, interim) => {
      live.innerHTML = (txt||interim) ? `<span class="en">${esc(txt)}</span> <span class="interim en">${esc(interim||"")}</span>` : `<span class="ph-text">「話す」を押して英語で話してください</span>`;
      $("btnDone").disabled = !(txt || interim || $("typeIn").value.trim());
    };
    paint("", "");
    $("typeIn").value = "";
    $("typeBox").classList.toggle("hidden", !!SR);
    $("btnType").classList.toggle("hidden", !SR);
    $("btnMic").classList.toggle("hidden", !SR); $("btnRetry").classList.toggle("hidden", !SR);
    let t0 = null, spent = 0, listening = false;

    const setMic = on => {
      listening = on;
      $("btnMic").textContent = on ? "一時停止" : (listener.text() ? "続けて話す" : "話す");
      $("btnMic").classList.toggle("on", on);
      live.classList.toggle("on", on);
    };
    setMic(false);

    $("btnMic").onclick = async () => {
      if (!SR){ return; }
      if (listening){
        await listener.stop(); spent += performance.now()-t0; setMic(false); paint(listener.text(),"");
      } else {
        stopSpeaking();
        t0 = performance.now(); setMic(true);
        listener.start(paint, err => {
          setMic(false);
          addSys(err === "unsupported" ? "この環境では音声認識が使えません。「文字で入力」を使ってください。"
            : "音声認識が許可されていません。iPhoneの「設定 > 一般 > キーボード > 音声入力」をオンにし、Safariのマイク許可を確認してください。");
          $("typeBox").classList.remove("hidden");
        });
      }
    };
    $("btnRetry").onclick = async () => {
      if (listening){ await listener.stop(); spent += performance.now()-t0; setMic(false); }
      listener.reset(); $("typeIn").value=""; paint("","");
      setMic(false);
    };
    $("btnType").onclick = () => { $("typeBox").classList.toggle("hidden"); };
    $("typeIn").oninput = () => { $("btnDone").disabled = !($("typeIn").value.trim() || listener.text()); };
    $("btnToggleAid").onclick = () => { aidOpen = !aidOpen; renderAid(turn); };

    const finish = async (skip) => {
      if (listening){ await listener.stop(); spent += performance.now()-t0; setMic(false); }
      const typed = $("typeIn").value.trim();
      const text = skip ? "" : [listener.text(), typed].filter(Boolean).join(" ").trim();
      $("dock").classList.add("hidden");
      resolve({ text, ms: Math.round(spent) });
    };
    $("btnDone").onclick = () => finish(false);
    $("btnSkip").onclick = () => finish(true);
  });
}

/* ---------- evaluation ---------- */
function evaluate(text, goals){
  const n = norm(text);
  return goals.map(g => g.re.test(n));
}
function tipsFor(text){
  const n = norm(text);
  const out = [];
  for (const r of RULES){
    if (r.re.test(n) && !S.tipSeen.has(r.from)){ S.tipSeen.add(r.from); out.push(r); }
  }
  return out;
}

function sectionGoals(sec){
  const g = [...sec.goals];
  const c = sec.cond && sec.cond[S.persona];
  if (c) g.push(c);
  return g;
}
function sectionScript(sec){
  const base = sec.script; const c = sec.condScript && sec.condScript[S.persona];
  if (!base) return null;
  if (c && c.replace) return c;
  return c ? L(base.en + " " + c.en, base.ja + c.ja) : base;
}

  const r = await userTurn(title, goals, script);
  if (S.aborted) return null;
  const status = evaluate(r.text, goals);
  status.forEach((ok,i) => { if (ok) res.hit.add(goals[i].ja); });
  const tips = r.text ? tipsFor(r.text) : [];
  res.turns.push({ label, text:r.text, ms:r.ms, goals: goals.map(g=>g.ja), status, script });
  res.tips.push(...tips);
  addMine(r.text, tips);
  S.lines.push({ who:"me", en:r.text });
  renderRail();
  return { status, text:r.text };
}

async function runSection(sec, secId){
  const goals = sectionGoals(sec);
  const script = sectionScript(sec);
  const res = S.results[secId];
  res.total = goals.length;
  renderRail();
  await themSay(pick(sec.prompt[S.persona]));
  if (S.aborted) return;
  const out = await runTurnAndScore(secId, `${SECTIONS[S.secIdx].ja}:あなたの番です`, goals, script, "");
  if (!out || S.aborted) return;
  // optional probe for the first missed goal that has a topic
  if (settings.probe && out.text){
    const missIdx = goals.findIndex(g => !res.hit.has(g.ja) && g.t);
    if (missIdx >= 0){
      const g = goals[missIdx];
      await themSay(L(pick(COMMON.probe).replace("{t}", g.t), COMMON.probeJa.replace("{t}", g.ja)));
      if (S.aborted) return;
      await runTurnAndScore(secId, "聞き返されました", [g], { en:g.phrase || "", ja:"" }, "聞き返し");
      if (S.aborted) return;
    }
  }
  if (secId === "wrapup") await themSay(pick(sec.closing[S.persona]));
  else await themSay(pick(sec.reaction[S.persona]));
}

async function runQA(sec){
  const res = S.results.qa;
  const pool = shuffle(sec.questions.filter(q => q.p.includes(S.persona)));
  const qs = pool.slice(0, 2);
  res.total = qs.reduce((n,q)=>n+q.goals.length, 0);
  renderRail();
  await themSay(pick(COMMON.qaIntro[S.persona]));
  for (let i=0;i<qs.length && !S.aborted;i++){
    const q = qs[i];
    await themSay(L(q.en, q.ja));
    if (S.aborted) return;
    const out = await runTurnAndScore("qa", `質問 ${i+1}/${qs.length}:答えてください`, q.goals, q.script, q.en);
    if (!out || S.aborted) return;
    const rate = out.status.filter(Boolean).length / q.goals.length;
    await themSay(rate >= 0.5 ? pick(COMMON.good[S.persona]) : pick(COMMON.weak));
  }
}

async function startMeeting(){
  stopSpeaking();
  S = {
    ...draft, secIdx:0, aborted:false, lines:[], tipSeen:new Set(), started:Date.now(),
    voice: voices.length ? pick(voices) : null,
    results: Object.fromEntries(SECTIONS.map(s => [s.id, { hit:new Set(), total:0, turns:[], tips:[] }]))
  };
  $("log").innerHTML = "";
  $("railTitle").textContent = S.theme.title;
  showScreen("meeting");
  renderRail();
  addSys(`${S.params.cname} が参加しました`);
  for (let i=0;i<SECTIONS.length && !S.aborted;i++){
    S.secIdx = i; renderRail();
    const id = SECTIONS[i].id, sec = S.theme.sections[id];
    if (id === "qa") await runQA(sec); else await runSection(sec, id);
  }
  if (S.aborted) return;
  S.secIdx = SECTIONS.length; renderRail();
  addSys("会議が終了しました");
  await sleep(1200);
  showReview();
}

/* =========================================================
   REVIEW
   ========================================================= */
function showReview(){
  let hit=0, total=0, ms=0, words=0;
  SECTIONS.forEach(s => { const r=S.results[s.id]; hit+=r.hit.size; total+=r.total; r.turns.forEach(t=>{ ms+=t.ms; words += t.text ? t.text.split(/\s+/).length : 0; }); });
  const pct = total ? Math.round(hit/total*100) : 0;
  const wpm = ms > 5000 ? Math.round(words/(ms/60000)) : null;
  $("rvTitle").textContent = S.theme.title;
  $("rvPct").textContent = pct + "%";
  $("rvMeta").textContent = `相手:${PERSONAS[S.persona].ja} / 練習:${{script:"台本",hint:"ヒント",bare:"何も見ない"}[settings.mode]} / 話した時間 ${Math.round(ms/1000)}秒 / ${words}語` + (wpm ? ` / 毎分${wpm}語` : "");

  $("rvBody").innerHTML = SECTIONS.map(s => {
    const r = S.results[s.id];
    const turns = r.turns.map((t,ti) => {
      const chips = t.goals.map((g,i)=>`<span class="chip ${t.status[i]?"hit":"miss"}">${t.status[i]?"✓ ":""}${esc(g)}</span>`).join("");
      const model = t.script && t.script.en ? `<details class="model"><summary>模範の言い方</summary>
          <div class="script"><div class="en">${esc(fill(t.script.en))}</div>${t.script.ja?`<div class="ja">${esc(fill(t.script.ja))}</div>`:""}</div>
          <button class="play" data-say="${esc(fill(t.script.en, true))}">▶ 聞く</button></details>` : "";
      return `${t.label?`<p class="q en">${esc(t.label)}</p>`:""}
        <div class="chips">${chips}</div>
        <p class="said ${t.text?"en":"none"}">${t.text?esc(t.text):"(話していません)"}</p>${model}`;
    }).join("");
    const tips = r.tips.map(t=>`<div class="tip" style="margin-top:8px"><b class="en">${esc(t.from)}</b> → <span class="en">${esc(t.to)}</span><br>${esc(t.ja)}</div>`).join("");
    return `<div class="rv"><div class="rv-head"><h3>${s.ja}</h3><span>${r.hit.size}/${r.total}</span></div>${turns}${tips}</div>`;
  }).join("");
  $("rvBody").querySelectorAll(".play").forEach(b => b.onclick = () => speak(b.dataset.say));

  const hist = store.get("me-history", []);
  hist.unshift({ at:Date.now(), title:S.theme.title, persona:PERSONAS[S.persona].ja, mode:settings.mode, pct });
  store.set("me-history", hist.slice(0,20));
  showScreen("review");
}

/* =========================================================
   HOME
   ========================================================= */
function renderHome(){
  // mode
  $("modeSeg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode===settings.mode)));
  $("modeNote").textContent = MODE_NOTE[settings.mode];
  // selectors
  $("selTheme").innerHTML = `<option value="random">ランダム</option>` + THEMES.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join("");
  $("selTheme").value = settings.theme;
  $("selPersona").innerHTML = `<option value="random">ランダム</option>` + Object.entries(PERSONAS).map(([k,v])=>`<option value="${k}">${v.ja}</option>`).join("");
  $("selPersona").value = settings.persona;
  $("inName").value = settings.name; $("selCC").value = settings.cc; $("selRate").value = settings.rate;
  $("chkJa").checked = settings.ja; $("chkProbe").checked = settings.probe;
  // history
  const hist = store.get("me-history", []);
  $("hist").innerHTML = hist.length ? hist.slice(0,5).map(h => {
    const d = new Date(h.at);
    return `<li><span>${d.getMonth()+1}/${d.getDate()} ${esc(h.title)}(${esc(h.persona)})</span><span class="pct">${h.pct}%</span></li>`;
  }).join("") : `<li><p class="empty-note">まだ練習の記録はありません。最初の会議を始めてみましょう。</p></li>`;
  renderBrief();
}

$("modeSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; settings.mode = b.dataset.mode; saveSettings(); renderHome(); };
$("btnShuffle").onclick = () => { draft = makeDraft(); renderBrief(); };
$("selTheme").onchange = e => { settings.theme = e.target.value; saveSettings(); draft = makeDraft(); renderBrief(); };
$("selPersona").onchange = e => { settings.persona = e.target.value; saveSettings(); draft = makeDraft(); renderBrief(); };
$("inName").onchange = e => { settings.name = e.target.value.trim(); saveSettings(); };
$("selCC").onchange = e => { settings.cc = e.target.value; saveSettings(); };
$("selRate").onchange = e => { settings.rate = e.target.value; saveSettings(); };
$("chkJa").onchange = e => { settings.ja = e.target.checked; saveSettings(); };
$("chkProbe").onchange = e => { settings.probe = e.target.checked; saveSettings(); };

$("btnStart").onclick = () => { startMeeting(); };
$("btnQuit").onclick = () => {
  if (!confirm("会議を終了してトップに戻りますか?")) return;
  S.aborted = true; listener.abort(); stopSpeaking();
  $("dock").classList.add("hidden");
  draft = makeDraft(); renderHome(); showScreen("home");
};
$("btnAgain").onclick = () => {
  // same theme & persona, fresh parameters
  const keepT = S.theme, keepP = S.persona;
  draft = makeDraft(); draft.theme = keepT; draft.persona = keepP;
  startMeeting();
};
$("btnHome").onclick = () => { draft = makeDraft(); renderHome(); showScreen("home"); };

if (!SR){
  $("noSR").classList.remove("hidden");
  $("noSR").textContent = "このブラウザでは音声認識が使えません。文字入力で練習できます(iPhone/iPadのSafariでは音声で話せます)。";
}

draft = makeDraft();
renderHome();

if ("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
